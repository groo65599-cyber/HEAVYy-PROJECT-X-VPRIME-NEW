name: Build HEAVYy PROJECT X V5.1 FINAL

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/HEAVYy PROJECT X V5.1 FINAL.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEAVYy-PROJECT-X-V5-1-FINAL
          path: "release/HEAVYy PROJECT X V5.1 FINAL.apk"
